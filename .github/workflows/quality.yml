name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      PYTHONUTF8: '1'
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.28'
          python-version: '3.12.13'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Synchronize locked dependencies
        run: uv sync --locked
      - name: Install the isolated deterministic DocVortex POC runtime
        run: uv run --locked python scripts/setup_docvortex_runtime.py
      - name: Run the shared offline quality gate
        run: uv run --locked python scripts/quality.py --output-dir tmp/quality/ci
      - name: Classify synthetic CLI/API fixture failures safely
        if: ${{ always() }}
        run: |
          uv run --locked python - <<'PYDIAG'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          source = Path("tmp/quality/ci/private/junit.xml")
          if not source.exists():
              raise SystemExit(0)
          for case in ET.parse(source).iter("testcase"):
              if case.get("name") != "test_cli_and_upload_api_run_real_shared_pipeline_once":
                  continue
              failure = case.find("failure")
              if failure is None:
                  continue
              detail = failure.text or ""
              statements = re.findall(r"^>\s+(.+)$", detail, re.MULTILINE)
              statement = statements[-1] if statements else ""
              checks = {"assert process.returncode": "worker_exit", "assert result[": "worker_counts", "assert [p[": "source_pages", "assert results[0]": "entry_output_equality"}
              category = next((value for key, value in checks.items() if statement.startswith(key)), "unknown")
              classes = re.findall(r"^E\s+(?:[a-zA-Z_][a-zA-Z0-9_]*\.)*(HTTPStatusError|TimeoutExpired|TimeoutError|ValueError|ImportError|ModuleNotFoundError|AssertionError|OSError):", detail, re.MULTILINE)
              diagnostic = {"fixture": "synthetic_blank_pdf_cli_api", "category": category, "exception_class": classes[-1] if classes else "unknown"}
              target = Path("tmp/quality/ci/public/acceptance-fixture-diagnostic.json")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(diagnostic) + "\n")
              print(json.dumps(diagnostic))
          PYDIAG
      - name: Upload only sanitized engineering reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ matrix.os }}
          path: |
            tmp/quality/ci/public/summary.json
            tmp/quality/ci/public/environment.json
            tmp/quality/ci/public/tests.json
            tmp/quality/ci/public/junit.xml
            tmp/quality/ci/public/acceptance-fixture-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
