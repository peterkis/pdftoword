[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2word-local"
version = "0.1.0"
description = "PDF2Word Local V1.1: local-first PDF to editable DOCX conversion core."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.14",
    "jsonschema>=4.26.0",
    "httpx>=0.27.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/core-domain/src/pdf2word_core_domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core-domain/src", ".", "scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/core-domain/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Chinese full-width punctuation in comments and docstrings is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/core-domain/src", "scripts"]
explicit_package_bases = true
namespace_packages = true
# scripts/smoke_models.py is a pre-existing manual smoke tool that depends on
# httpx (included in the dev group for Gate tools) and predates the typed
# toolchain; it will be superseded by the P0-GATE-001 capability probing.
exclude = ["smoke_models"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
